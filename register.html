<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Académico - SIA 2026</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper { width: 100%; max-width: 500px; padding: 40px; margin: 20px 0; }
        .auth-header { text-align: center; margin-bottom: 25px; }
        .auth-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 8px; }
        .auth-subtitle { color: var(--text-muted); font-size: 0.9rem; }
        .auth-footer { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-link { color: var(--accent-primary); text-decoration: none; font-weight: 600; transition: var(--transition-fluid); }
        .auth-link:hover { color: var(--accent-hover); text-decoration: underline; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .select-input { appearance: none; cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'></polyline></svg>"); background-repeat: no-repeat; background-position: right 12px center; background-size: 16px; padding-right: 40px !important; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; gap: 0; } }
    </style>
</head>
<body>
    <div class="preloader" id="global-preloader"><div class="spinner"></div></div>
    
    <main class="glass-container auth-wrapper">
        <div class="auth-header">
            <h1 class="auth-title">Crear Cuenta Estudiantil</h1>
            <p class="auth-subtitle">Regístrate en el Sistema de Información Académica unificado</p>
        </div>
        
        <form id="register-form" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label" for="reg-name">Nombre Completo</label>
                <input class="form-input" type="text" id="reg-name" required placeholder="usuario">
            </div>
            
            <div class="form-group">
                <label class="form-label" for="reg-email">Correo Electrónico</label>
                <input class="form-input" type="email" id="reg-email" required placeholder="ejemplo@universidad.edu.co">
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="reg-programa">Programa Académico</label>
                    <select class="form-input select-input" id="reg-programa" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="Ingeniería Mecánica">Ingeniería Mecánica</option>
                        <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                        <option value="Tecnología en Electrónica">Tecnología en Electrónica</option>
                        <option value="Diseño Industrial">Tecnologia en mecanica automotriz</option>
                        <option value="Diseño Industrial">Ingenieria Industrial</option>
                        <option value="Diseño Industrial">Ingenieria administrativa</option>
                        <option value="Diseño Industrial">Ingenieria electrica</option>
                        <option value="Diseño Industrial">Ingenieria de materiales</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-semestre">Semestre Actual</label>
                    <select class="form-input select-input" id="reg-semestre" required>
                        <option value="" disabled selected>Selecciona...</option>
                        <option value="1">Primer Semestre (1°)</option>
                        <option value="2">Segundo Semestre (2°)</option>
                        <option value="3">Tercer Semestre (3°)</option>
                        <option value="4">Cuarto Semestre (4°)</option>
                        <option value="5">Quinto Semestre (5°)</option>
                        <option value="6">Sexto Semestre (6°)</option>
                        <option value="7">Séptimo Semestre (7°)</option>
                        <option value="8">Octavo Semestre (8°)</option>
                        <option value="9">Noveno Semestre (9°)</option>
                        <option value="10">Décimo Semestre (10°)</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label" for="reg-password">Contraseña</label>
                    <input class="form-input" type="password" id="reg-password" required minlength="6" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-confirm">Confirmar Contraseña</label>
                    <input class="form-input" type="password" id="reg-confirm" required minlength="6" placeholder="••••••••">
                </div>
            </div>
            
            <button type="submit" class="btn-primary" id="btn-submit-register">
                <span>Completar Registro</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
            </button>
        </form>
        
        <div class="auth-footer">
            ¿Ya tienes una cuenta del SIA? <a href="login.html" class="auth-link">Inicia sesión</a>
        </div>
    </main>

    <div class="toast-container" id="global-toast-container"></div>
    <script src="js/storage.js"></script>
    <script src="js/script.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

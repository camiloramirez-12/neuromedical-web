<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario Modificable y Sincronizado - SIA 2026</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { display: flex; align-items: stretch; justify-content: flex-start; overflow: hidden; height: 100vh; }
        .dashboard-layout { display: flex; width: 100vw; height: 100vh; }
        .sidebar { width: 260px; height: 100%; padding: 24px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 0 var(--border-radius-lg) var(--border-radius-lg) 0; z-index: 100; }
        .main-content { flex: 1; padding: 40px; overflow-y: auto; height: 100%; }
        .schedule-interface { display: grid; grid-template-columns: 1fr 2.5fr; gap: 25px; margin-top: 20px; }
        .timetable-grid { display: grid; grid-template-columns: 100px repeat(5, 1fr); gap: 10px; min-width: 750px; }
        .time-header { background: rgba(255,255,255,0.03); text-align: center; padding: 12px; font-weight: 700; border-bottom: 2px solid var(--accent-primary); font-size: 0.9rem; }
        .time-cell-label { background: rgba(255,255,255,0.02); border: 1px dashed var(--glass-border); padding: 10px; font-weight: 600; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; }
        .schedule-card { padding: 10px; border-radius: var(--border-radius-sm); border-left: 4px solid var(--accent-primary); font-size: 0.8rem; position: relative; min-height: 80px; display: flex; flex-direction: column; justify-content: space-between; background: rgba(255,255,255,0.01); border: 1px solid var(--glass-border); }
        .delete-block-btn { position: absolute; top: 5px; right: 5px; background: var(--danger); border: none; color: white; border-radius: 3px; cursor: pointer; padding: 2px 6px; font-size: 0.7rem; font-weight: 700; opacity: 0.3; transition: var(--transition-fluid); }
        .schedule-card:hover .delete-block-btn { opacity: 1; }
        @media (max-width: 1100px) { .schedule-interface { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="preloader" id="global-preloader"><div class="spinner"></div></div>
    <div class="dashboard-layout">
        <aside class="glass-container sidebar">
            <div>
                <h3 style="padding-bottom:20px; border-bottom:1px solid var(--glass-border);">Campus pascual bravo</h3>
                <ul style="list-style:none; margin-top:20px; display:flex; flex-direction:column; gap:8px;">
                    <li><a href="dashboard.html" style="color:var(--text-muted); text-decoration:none; font-weight:600; display:block; padding:10px;">Inicio</a></li>
                    <li><a href="materias.html" style="color:var(--text-muted); text-decoration:none; font-weight:600; display:block; padding:10px;">Mis Materias</a></li>
                    <li><a href="pensum.html" style="color:var(--text-muted); text-decoration:none; font-weight:600; display:block; padding:10px;">Mi Pensum</a></li>
                    <li><a href="notas.html" style="color:var(--text-muted); text-decoration:none; font-weight:600; display:block; padding:10px;">Calculadora Notas</a></li>
                    <li><a href="horarios.html" style="color:var(--text-main); font-weight:700; display:block; padding:10px; border-left:4px solid var(--accent-primary);">Horarios</a></li>
                </ul>
            </div>
            <button class="btn-secondary" onclick="window.db.cerrarSesion(); window.location.href='index.html';">Salir</button>
        </aside>

        <main class="main-content">
            <h2>Planificación de Horarios Interactiva</h2>
            <p style="color: var(--text-muted);">Asigna y gestiona tus bloques de clase semanales con sincronización global en la nube.</p>

            <div class="schedule-interface">
                <div class="interactive-card" style="height: fit-content;">
                    <h4>Asignar Bloque Horario</h4>
                    <form id="schedule-form" onsubmit="return false;" style="margin-top:15px;">
                        <div class="form-group">
                            <label class="form-label">Asignatura</label>
                            <input type="text" id="sch-name" class="form-input" required placeholder="Ej: Física Mecánica">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Aula / Aula Virtual</label>
                            <input type="text" id="sch-room" class="form-input" required placeholder="Ej: Bloque M-201">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Día de la semana</label>
                            <select id="sch-day" class="form-input">
                                <option value="Lunes">Lunes</option>
                                <option value="Martes">Martes</option>
                                <option value="Miercoles">Miércoles</option>
                                <option value="Jueves">Jueves</option>
                                <option value="Viernes">Viernes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Franja Horaria</label>
                            <select id="sch-time" class="form-input">
                                <option value="06-08">06:00 AM - 08:00 AM</option>
                                <option value="08-10">08:00 AM - 10:00 AM</option>
                                <option value="10-12">10:00 AM - 12:00 PM</option>
                                <option value="12-14">12:00 PM - 02:00 PM</option>
                                <option value="14-16">02:00 PM - 04:00 PM</option>
                                <option value="16-18">04:00 PM - 06:00 PM</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Color del Bloque</label>
                            <input type="color" id="sch-color" class="form-input" style="padding:4px; height:40px;" value="#4f46e5">
                        </div>
                        <button class="btn-primary" id="btn-save-schedule">Fijar en Horario</button>
                    </form>
                </div>

                <div class="interactive-card" style="overflow-x: auto;">
                    <div class="timetable-grid" id="timetable-matrix">
                        <div class="time-header">Franja</div>
                        <div class="time-header">Lunes</div>
                        <div class="time-header">Martes</div>
                        <div class="time-header">Miércoles</div>
                        <div class="time-header">Jueves</div>
                        <div class="time-header">Viernes</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const sesion = window.db.obtenerSesionActual();
            if(!sesion) { window.location.href = 'login.html'; return; }

            // Descargar los últimos cambios antes de pintar la matriz en pantalla
            await window.db.descargarDatosDeLaNube();

            setTimeout(() => {
                document.getElementById('global-preloader').style.opacity = '0';
                document.getElementById('global-preloader').style.visibility = 'hidden';
            }, 200);

            const franjas = ["06-08", "08-10", "10-12", "12-14", "14-16", "16-18"];
            const dias = ["Lunes", "Martes", "Miercoles", "Jueves", "Viernes"];

            function obtenerHorarios() {
                // Ahora usamos el motor relacional reutilizando la tabla de eventos para mantener la base de datos limpia
                const todosLosEventos = JSON.parse(localStorage.getItem(window.db.INIT_KEY_EVENTS)) || [];
                return todosLosEventos.filter(e => e.usuarioId === sesion.id && e.esBloqueHorario === true);
            }

            function renderMatrix() {
                const matrixContainer = document.getElementById('timetable-matrix');
                matrixContainer.innerHTML = `
                    <div class="time-header">Franja</div>
                    <div class="time-header">Lunes</div>
                    <div class="time-header">Martes</div>
                    <div class="time-header">Miércoles</div>
                    <div class="time-header">Jueves</div>
                    <div class="time-header">Viernes</div>
                `;

                const bloques = obtenerHorarios();

                franjas.forEach(franja => {
                    const labelCell = document.createElement('div');
                    labelCell.className = 'time-cell-label';
                    labelCell.innerText = franja.replace('-', ' a ');
                    matrixContainer.appendChild(labelCell);

                    dias.forEach(dia => {
                        const cell = document.createElement('div');
                        cell.style.minHeight = "90px";
                        
                        const encontrarBloque = bloques.find(b => b.franja === franja && b.dia === dia);

                        if(encontrarBloque) {
                            cell.innerHTML = `
                                <div class="schedule-card" style="border-left-color: ${encontrarBloque.color}; background: rgba(255,255,255,0.02); height:100%;">
                                    <button class="delete-block-btn" onclick="eliminarBloqueHorario('${encontrarBloque.id}')">X</button>
                                    <strong>${encontrarBloque.materia}</strong>
                                    <span style="color:var(--text-muted); font-size:0.75rem;">${encontrarBloque.aula}</span>
                                </div>
                            `;
                        } else {
                            cell.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:rgba(255,255,255,0.05); font-size:1.5rem;">-</div>`;
                        }
                        matrixContainer.appendChild(cell);
                    });
                });
            }

            document.getElementById('btn-save-schedule').addEventListener('click', () => {
                const name = document.getElementById('sch-name').value.trim();
                const room = document.getElementById('sch-room').value.trim();
                const day = document.getElementById('sch-day').value;
                const time = document.getElementById('sch-time').value;
                const color = document.getElementById('sch-color').value;

                if(!name || !room) {
                    window.app.mostrarToast('Por favor diligencie todos los campos.', 'warning');
                    return;
                }

                let bloquesActuales = obtenerHorarios();
                if(bloquesActuales.some(b => b.dia === day && b.franja === time)) {
                    window.app.mostrarToast('Ya tienes una asignatura asignada a esta franja horaria.', 'danger');
                    return;
                }

                // Guardar usando el método relacional que dispara automáticamente la actualización a Firebase
                window.db.guardarEvento({
                    usuarioId: sesion.id,
                    esBloqueHorario: true,
                    materia: name,
                    aula: room,
                    dia: day,
                    franja: time,
                    color: color
                });

                window.app.mostrarToast('Asignatura indexada e interconectada en la nube.', 'success');
                document.getElementById('sch-name').value = '';
                document.getElementById('sch-room').value = '';
                
                // Forzar refresco visual
                setTimeout(renderMatrix, 300);
            });

            window.eliminarBloqueHorario = function(id) {
                window.db.eliminarEvento(id);
                window.app.mostrarToast('Bloque horario removido.', 'info');
                setTimeout(renderMatrix, 300);
            };

            renderMatrix();
        });
    </script>
</body>
</html>

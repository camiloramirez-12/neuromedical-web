<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - SIA 2026</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .auth-wrapper { width: 100%; max-width: 420px; padding: 40px; }
        .auth-header { text-align: center; margin-bottom: 30px; }
        .auth-title { font-size: 1.75rem; font-weight: 700; margin-bottom: 8px; }
        .auth-subtitle { color: var(--text-muted); font-size: 0.9rem; }
        .auth-footer { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
        .auth-link { color: var(--accent-primary); text-decoration: none; font-weight: 600; transition: var(--transition-fluid); }
        .auth-link:hover { color: var(--accent-hover); text-decoration: underline; }
        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .checkbox-input { cursor: pointer; width: 16px; height: 16px; accent-color: var(--accent-primary); }
        .checkbox-label { font-size: 0.9rem; color: var(--text-muted); cursor: pointer; user-select: none; }
    </style>
</head>
<body>
    <div class="preloader" id="global-preloader"><div class="spinner"></div></div>
    
    <main class="glass-container auth-wrapper">
        <div class="auth-header">
            <h1 class="auth-title">Bienvenido de nuevo</h1>
            <p class="auth-subtitle">Ingresa tus credenciales para acceder al campus virtual</p>
        </div>
        
        <form id="login-form" onsubmit="return false;">
            <div class="form-group">
                <label class="form-label" for="login-email">Correo Institucional o personal</label>
                <input class="form-input" type="email" id="login-email" required autocomplete="email" placeholder="usuario@universidad.edu.co">
            </div>
            <div class="form-group">
                <label class="form-label" for="login-password">Contraseña</label>
                <input class="form-input" type="password" id="login-password" required autocomplete="current-password" placeholder="••••••••">
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="login-remember" class="checkbox-input">
                <label for="login-remember" class="checkbox-label">Recordar sesión en este dispositivo</label>
            </div>
            
            <button type="submit" class="btn-primary" id="btn-submit-login">
                <span>Iniciar Sesión</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13 12H3"/></svg>
            </button>
        </form>
        
        <div class="auth-footer">
            ¿No tienes una cuenta académica o personal? <a href="register.html" class="auth-link">Regístrate aquí</a>
        </div>
    </main>

    <div class="toast-container" id="global-toast-container"></div>
    <script src="js/storage.js"></script>
    <script src="js/script.js"></script>
    <script src="js/login.js"></script>
</body>
</html>

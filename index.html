<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIA - Sistema Integrado Académico v2026</title>
    <!-- Hoja de Estilo Única Centralizada -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Pantalla de Carga Síncrona (Preloader) -->
    <div class="preloader" id="global-preloader">
        <div class="spinner"></div>
    </div>

    <!-- Contenedor del Portal de Bienvenida (Glassmorphism Core) -->
    <main class="glass-container welcome-wrapper">
        <!-- Logo Institucional Renderizado Nativo SVG -->
        <svg class="welcome-logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 3L1 9L12 15L21 10.05V16.5H23V9L12 3Z" fill="#4f46e5"/>
            <path d="M4.18182 12.2182V17.0909C4.18182 18.5 7.68182 21 12 21C16.3182 21 19.8182 18.5 19.8182 17.0909V12.2182L12 16.4818L4.18182 12.2182Z" fill="#6366f1"/>
        </svg>

        <h1 class="welcome-title">Portal Pascual bravo </h1>
        <p class="welcome-tagline">Gestión de Pensum, Notas y Planificación Semestral.</p>

        <!-- Acciones de Enrutamiento Inmediato -->
        <div class="welcome-actions">
            <button class="btn-primary" onclick="window.location.href='login.html'">
                <span>Ingresar al Sistema</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
            <button class="btn-secondary" onclick="window.location.href='register.html'">
                Create una cuenta
            </button>
        </div>
    </main>

    <!-- Contenedor Global para Notificaciones Dinámicas (Toast Engine) -->
    <div class="toast-container" id="global-toast-container"></div>

    <!-- Scripts de Control Críticos -->
    <script src="js/storage.js"></script>
    <script src="js/script.js"></script>
    <script>
        // Control Lógico Inmediato de Ciclo de Vida del Sitio
        document.addEventListener("DOMContentLoaded", () => {
            const preloader = document.getElementById('global-preloader');
            
            // Evaluar sesión activa antes de renderizar la vista de bienvenida
            if (window.db && window.db.obtenerSesionActual()) {
                const usuario = window.db.obtenerSesionActual();
                if (usuario.rol === 'admin') {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }
                return;
            }

            // Aplicar configuraciones de tema guardadas en base de datos global
            const config = window.db ? window.db.obtenerConfiguracion() : null;
            if (config) {
                document.documentElement.setAttribute('data-theme', config.theme);
            }

            // Remover pantalla de carga con desvanecimiento fluido
            setTimeout(() => {
                preloader.style.opacity = '0';
                preloader.style.visibility = 'hidden';
            }, 400);
        });
    </script>
</body>
</html>
